name: Build Android companion
on:
  workflow_dispatch:
  push:
    paths: ['android-companion/**', '.github/workflows/android-companion.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android-companion :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Delilah-Android-Companion-test-APK
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
